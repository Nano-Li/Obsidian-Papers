[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-papers"
version = "0.2.2"
description = "Download linked papers through campus Edge access and convert with MinerU into a shared Obsidian folder."
requires-python = ">=3.11"
dependencies = ["curl-cffi==0.15.0", "playwright>=1.40,<2", "pypdf>=5,<7"]

[project.scripts]
obsidian-papers = "obpaper.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
